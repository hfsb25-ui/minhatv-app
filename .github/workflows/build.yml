name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          if ! gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log; then
            grep -E "^e: |error:|What went wrong|Could not|> " build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk MinhaTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MinhaTV-apk
          path: MinhaTV.apk

      - name: Guardar o APK no branch "apk"
        shell: bash
        run: |
          mkdir -p /tmp/out && cp MinhaTV.apk /tmp/out/
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add MinhaTV.apk
          git commit -q -m "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk

      - name: Publicar na página de Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete ultima-versao -y --cleanup-tag || true
          gh release create ultima-versao MinhaTV.apk --title "Minha TV (última versão)" --notes "APK gerado automaticamente a partir do código ${GITHUB_SHA::7}."
