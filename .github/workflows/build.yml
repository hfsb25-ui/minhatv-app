name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          if ! gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log; then
            grep -E "^e: |error:|What went wrong|Could not|> " build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk MinhaTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MinhaTV-apk
          path: MinhaTV.apk
